<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#050402"/>
    </radialGradient>
    <linearGradient id="goldLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="laserBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.3"/>

  <!-- 4-Slot VLIW Crossing Laser Beams -->
  <g filter="url(#laserBlur)" stroke="url(#goldLaser)" stroke-width="6" opacity="0.8">
    <line x1="64" y1="64" x2="448" y2="448" stroke-width="8"/>
    <line x1="448" y1="64" x2="64" y2="448" stroke-width="8"/>
    <line x1="256" y1="32" x2="256" y2="480" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
    <line x1="32" y1="256" x2="480" y2="256" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
  </g>

  <!-- 4D Torus Lattice Rings -->
  <ellipse cx="256" cy="256" rx="160" ry="80" fill="none" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.4" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="160" ry="80" fill="none" stroke="#FBBF24" stroke-width="3" stroke-opacity="0.4" transform="rotate(30 256 256)"/>

  <!-- Core Hexagon Container -->
  <polygon points="256,120 376,188 376,324 256,392 136,324 136,188" 
           fill="#0A0804" stroke="url(#goldLaser)" stroke-width="6" filter="url(#laserBlur)"/>

  <!-- CL Text Emblem -->
  <text x="256" y="285" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="124" 
        font-weight="900" 
        letter-spacing="2"
        fill="url(#neonGlow)" 
        text-anchor="middle"
        filter="url(#laserBlur)">
    CL
  </text>

  <!-- Subtitle -->
  <text x="256" y="345" 
        font-family="monospace" 
        font-size="18" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#FDE68A" 
        text-anchor="middle" 
        opacity="0.9">
    MACHINE VLIW · 128-BIT
  </text>
</svg>
