<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="crBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#crBg)" stroke="#06B6D4" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Neural Synapse Ripples -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyanViolet)" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyanViolet)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4"/>

  <!-- 4D Hypercube Outer / Inner Frame -->
  <polygon points="256,90 390,167 390,323 256,400 122,323 122,167" 
           fill="none" stroke="url(#cyanViolet)" stroke-width="4" opacity="0.6"/>
  <polygon points="256,130 350,185 350,295 256,350 162,295 162,185" 
           fill="#040814" stroke="url(#cyanViolet)" stroke-width="5" filter="url(#cyanGlow)"/>

  <!-- CR Text Emblem -->
  <text x="256" y="285" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="124" 
        font-weight="900" 
        letter-spacing="2"
        fill="url(#cyanText)" 
        text-anchor="middle"
        filter="url(#cyanGlow)">
    CR
  </text>

  <!-- Subtitle -->
  <text x="256" y="345" 
        font-family="monospace" 
        font-size="18" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#BAE6FD" 
        text-anchor="middle" 
        opacity="0.9">
    COGNITIVE SPEC · SMT
  </text>
</svg>
